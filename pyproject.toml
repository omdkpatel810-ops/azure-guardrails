[project]
name = "azure-guardrails"
version = "0.1.0"
description = "A governed Azure landing zone: management groups, policy as code, environment vending and FinOps, in Terraform."
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"

[tool.coverage.run]
source = ["tools", "space", "scripts", "finops"]
branch = true

[tool.coverage.report]
show_missing = true
exclude_lines = ["pragma: no cover", "if __name__ == .__main__.:"]

[tool.ruff]
line-length = 130
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
# One resource or fixture per line reads better than wrapped tuples.
"finops/sample.py" = ["E501"]
"tests/test_finops.py" = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["app", "demo", "finops", "scripts", "tools"]
